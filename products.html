<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | Veloura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrapper">
        <a href="index.html" class="brand" aria-label="Veloura Home">VELOURA</a>
        <button class="menu-toggle" type="button" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="products.html" class="active">Products</a>
          <a href="products.html?category=all">Categories</a>
          <a href="index.html#about">About</a>
          <a href="login.html">Admin/Login</a>
        </nav>
        <a class="nav-cta" href="products.html">Shop Now</a>
      </div>
    </header>

    <main>
      <section class="page-hero products-page-hero">
        <div class="container">
          <p class="eyebrow">Curated collection</p>
          <h1>Fashion essentials</h1>
        </div>
      </section>

      <section class="section catalog-section">
        <div class="container">
          <div class="filters-panel">
            <div class="filter-group search-group">
              <label for="search-input">Search</label>
              <input id="search-input" type="text" placeholder="Search products..." />
            </div>

            <div class="filter-group">
              <label for="category-filter">Category</label>
              <select id="category-filter">
                <option value="all">All Categories</option>
              </select>
            </div>

            <div class="filter-group price-group">
              <label for="min-price">Min Price</label>
              <input id="min-price" type="number" min="0" step="1" placeholder="0" />
            </div>

            <div class="filter-group price-group">
              <label for="max-price">Max Price</label>
              <input id="max-price" type="number" min="0" step="1" placeholder="200" />
            </div>

            <div class="filter-group">
              <label for="availability-filter">Availability</label>
              <select id="availability-filter">
                <option value="all">All</option>
                <option value="in-stock">In Stock</option>
                <option value="out-of-stock">Out of Stock</option>
              </select>
            </div>

            <div class="filter-actions">
              <button id="apply-filters" class="btn btn-primary" type="button">Apply Filters</button>
              <button id="clear-filters" class="btn btn-secondary" type="button">Clear</button>
            </div>
          </div>

          <div class="catalog-toolbar">
            <p id="product-count">0 products</p>
          </div>

          <div id="products-grid" class="product-grid"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div>
          <a href="index.html" class="brand footer-brand">VELOURA</a>
        </div>
        <div class="footer-links">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="login.html">Admin</a>
        </div>
      </div>
    </footer>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
    <script src="js/products.js"></script>
  </body>
</html>
