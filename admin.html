<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Veloura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body class="admin-body">
    <header class="site-header admin-header">
      <div class="container nav-wrapper">
        <a href="index.html" class="brand" aria-label="Veloura Home">VELOURA</a>
        <button class="menu-toggle" type="button" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <nav class="main-nav" id="main-nav" aria-label="Main navigation">
          <a href="index.html">Storefront</a>
          <a href="products.html">Products</a>
          <a href="admin.html" class="active">Dashboard</a>
        </nav>
        <button id="logout-btn" class="btn btn-secondary" type="button">Logout</button>
      </div>
    </header>

    <main class="admin-shell">
      <div class="container admin-layout">
        <aside class="admin-sidebar">
          <div class="sidebar-card">
            <p class="eyebrow">Control Panel</p>
            <h2>Admin</h2>
            <ul class="sidebar-menu">
              <li><a href="#stats">Overview</a></li>
              <li><a href="#product-management">Products</a></li>
              <li><a href="#category-management">Categories</a></li>
            </ul>
          </div>
        </aside>

        <section class="admin-main">
          <div id="stats" class="dashboard-grid">
            <div class="stat-card">
              <span>Total Products</span>
              <strong id="stat-total-products">0</strong>
            </div>
            <div class="stat-card">
              <span>Total Categories</span>
              <strong id="stat-total-categories">0</strong>
            </div>
            <div class="stat-card">
              <span>Active Products</span>
              <strong id="stat-active-products">0</strong>
            </div>
            <div class="stat-card">
              <span>Out of Stock</span>
              <strong id="stat-out-of-stock">0</strong>
            </div>
          </div>

          <div id="product-management" class="admin-panel">
            <div class="panel-header">
              <h3>Product Management</h3>
            </div>

            <form id="product-form" class="admin-form">
              <input type="hidden" id="product-id" />

              <div class="form-grid">
                <div class="form-group">
                  <label for="product-name">Product Name</label>
                  <input id="product-name" name="productName" type="text" required />
                </div>

                <div class="form-group">
                  <label for="product-sku">SKU</label>
                  <input id="product-sku" name="sku" type="text" required />
                </div>

                <div class="form-group">
                  <label for="product-category">Category</label>
                  <select id="product-category" name="category" required>
                    <option value="">Select Category</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="product-price">Price</label>
                  <input id="product-price" name="price" type="number" min="0" step="0.01" required />
                </div>

                <div class="form-group">
                  <label for="product-quantity">Quantity</label>
                  <input id="product-quantity" name="quantity" type="number" min="0" required />
                </div>

                <div class="form-group">
                  <label for="product-status">Status</label>
                  <select id="product-status" name="status">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                    <option value="out of stock">Out of Stock</option>
                  </select>
                </div>

                <div class="form-group full-width">
                  <label for="product-description">Description</label>
                  <textarea id="product-description" name="description" rows="4" required></textarea>
                </div>

                <div class="form-group">
                  <label for="product-sizes">Sizes</label>
                  <input id="product-sizes" name="sizes" type="text" placeholder="S, M, L, XL" />
                </div>

                <div class="form-group">
                  <label for="product-colors">Colors</label>
                  <input id="product-colors" name="colors" type="text" placeholder="Black, White" />
                </div>

                <div class="form-group full-width">
                  <label for="product-image">Main Image URL</label>
                  <input id="product-image" name="image" type="url" required />
                </div>

                <div class="form-group full-width">
                  <label for="product-images">Additional Images URL (comma separated)</label>
                  <input id="product-images" name="images" type="text" placeholder="https://..., https://..." />
                </div>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="save-product-btn">Save Product</button>
                <button type="button" class="btn btn-secondary" id="cancel-product-edit">Cancel</button>
              </div>
            </form>
          </div>

          <div id="category-management" class="admin-panel">
            <div class="panel-header">
              <h3>Category Management</h3>
            </div>

            <form id="category-form" class="admin-form compact-form">
              <input type="hidden" id="category-id" />

              <div class="form-grid">
                <div class="form-group">
                  <label for="category-name">Category Name</label>
                  <input id="category-name" name="categoryName" type="text" required />
                </div>

                <div class="form-group">
                  <label for="category-image">Category Image URL</label>
                  <input id="category-image" name="categoryImage" type="url" required />
                </div>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Category</button>
                <button type="button" class="btn btn-secondary" id="cancel-category-edit">Cancel</button>
              </div>
            </form>
          </div>

          <div class="admin-panel">
            <div class="panel-header">
              <h3>Products List</h3>
            </div>
            <div id="admin-product-list" class="table-wrapper"></div>
          </div>

          <div class="admin-panel">
            <div class="panel-header">
              <h3>Categories List</h3>
            </div>
            <div id="admin-category-list" class="category-list"></div>
          </div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
